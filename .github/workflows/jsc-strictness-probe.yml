name: JSC strictness probe

on:
  pull_request:
    paths:
      - 'benchmarks/jsc/inadequate-coverage-repro.js'
      - '.github/workflows/jsc-strictness-probe.yml'

jobs:
  strictness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download exact JSC build embedded by Bun 1.4.1-canary.1+11fb73032
        shell: bash
        run: |
          set -euxo pipefail
          url='https://github.com/oven-sh/WebKit/releases/download/autobuild-cb61607f1a4bae79d7701965062634dee9efb349/bun-webkit-linux-amd64.tar.gz'
          curl -L --fail --retry 4 --retry-all-errors "$url" -o /tmp/bun-webkit.tar.gz
          echo '637271c46b1a8a0736acb8748bbe9c16528d3399e064fcdffbb293630ca63de3  /tmp/bun-webkit.tar.gz' | sha256sum -c -
          tar -xzf /tmp/bun-webkit.tar.gz
          test -x bun-webkit/bin/jsc

      - name: Compare sloppy script, strict script, and module
        shell: bash
        run: |
          set -euo pipefail
          JSC="$PWD/bun-webkit/bin/jsc"
          SCRIPT="$PWD/benchmarks/jsc/inadequate-coverage-repro.js"
          STRICT="$RUNNER_TEMP/inadequate-coverage-strict.js"
          printf "'use strict';\n" > "$STRICT"
          cat "$SCRIPT" >> "$STRICT"

          run_case() {
            label="$1"
            file="$2"
            mode="$3"
            threshold="$4"
            args=(
              --useFTLJIT=false
              --useConcurrentJIT=false
              --reportDFGCompileTimes=true
              --logCompilationChanges=true
              --printEachOSRExit=true
              --verboseDFGOSRExit=true
              --verboseOSR=true
            )
            if [ -n "$threshold" ]; then
              args+=(--osrExitCountForReoptimization="$threshold")
            fi
            if [ "$mode" = module ]; then
              "$JSC" "${args[@]}" --module-file="$file" >"${label}.all" 2>&1
            else
              "$JSC" "${args[@]}" "$file" >"${label}.all" 2>&1
            fi
            exits=$(grep -c 'Speculation failure in scorePostingDoc.*InadequateCoverage' "${label}.all" || true)
            max=$(grep 'Speculation failure in scorePostingDoc.*InadequateCoverage' "${label}.all" | sed -n 's/.*osrExitCounter = \([0-9]*\).*/\1/p' | sort -n | tail -1 || true)
            dfg=$(grep -c 'Optimized scorePostingDoc' "${label}.all" || true)
            repro=$(grep '^REPRO ' "${label}.all" | tail -1 || true)
            echo "STRICTNESS ${label} mode=${mode} threshold=${threshold:-default} ${repro#REPRO } inadequate_exits=${exits} max_counter=${max:-0} dfg_compiles=${dfg}"
            echo "--- ${label} reoptimization/OSR markers ---"
            grep -E 'scorePostingDoc|drive|OSR entry|reoptim|Jettison|LoopReoptimization|trigger.*optimization|Speculation failure' "${label}.all" | head -160 || true
          }

          run_case sloppy-script "$SCRIPT" script ''
          run_case strict-script "$STRICT" script ''
          run_case strict-script-reopt1 "$STRICT" script 1
          run_case module "$SCRIPT" module ''

      - name: Upload strictness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-jsc-strictness-cb61607
          path: '*.all'
