name: JSC module call-linkage probe

on:
  pull_request:
    paths:
      - 'benchmarks/jsc/inadequate-coverage-repro.js'
      - '.github/workflows/jsc-module-call-linkage-probe.yml'

jobs:
  linkage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download exact JSC build embedded by Bun 1.4.1-canary.1+11fb73032
        shell: bash
        run: |
          set -euxo pipefail
          url='https://github.com/oven-sh/WebKit/releases/download/autobuild-cb61607f1a4bae79d7701965062634dee9efb349/bun-webkit-linux-amd64.tar.gz'
          curl -L --fail --retry 4 --retry-all-errors "$url" -o /tmp/bun-webkit.tar.gz
          echo '637271c46b1a8a0736acb8748bbe9c16528d3399e064fcdffbb293630ca63de3  /tmp/bun-webkit.tar.gz' | sha256sum -c -
          tar -xzf /tmp/bun-webkit.tar.gz
          test -x bun-webkit/bin/jsc

      - name: Compare caller/linkage/environment variants
        shell: bash
        run: |
          set -euo pipefail
          JSC="$PWD/bun-webkit/bin/jsc"
          SCRIPT="$PWD/benchmarks/jsc/inadequate-coverage-repro.js"
          GLOBAL_CALL="$RUNNER_TEMP/inadequate-coverage-global-call.js"
          STRICT_SCRIPT="$RUNNER_TEMP/inadequate-coverage-strict-script.js"
          NO_CAPTURE="$RUNNER_TEMP/inadequate-coverage-no-callee-capture.js"
          NO_CAPTURE_STRICT="$RUNNER_TEMP/inadequate-coverage-no-callee-capture-strict.js"

          # Same module callee, but dispatch through a stable global property.
          awk '
            { print }
            $0 == "const results = new Map()" { print "globalThis.__scorePostingDoc = scorePostingDoc" }
          ' "$SCRIPT" | sed 's/^    scorePostingDoc(results,/    globalThis.__scorePostingDoc(results,/' > "$GLOBAL_CALL"

          printf "'use strict';\n" > "$STRICT_SCRIPT"
          cat "$SCRIPT" >> "$STRICT_SCRIPT"

          # Preserve the two-phase uncovered result.score access while removing every
          # module-environment read/write from scorePostingDoc itself. sink is consumed
          # only by the caller; the callee returns a numeric value on both branches.
          cat > "$NO_CAPTURE" <<'JS'
          const INSERTS = 20000
          const UPDATES = 200000
          const now = typeof performance !== 'undefined' && typeof performance.now === 'function'
            ? () => performance.now()
            : () => Date.now()
          const emit = typeof print === 'function' ? print : (...args) => console.log(...args)

          let sink = 0

          function scorePostingDoc(results, docId, termFreq) {
            const fieldLength = 1 + (docId & 7)
            const rawScore = termFreq * 2.2 / (termFreq + 1.2 * (0.3 + 0.7 * fieldLength))
            const weightedScore = 1.7 * rawScore
            const result = results.get(docId)
            if (result) {
              result.score += weightedScore
              return result.score
            }
            results.set(docId, { score: weightedScore })
            return weightedScore
          }
          if (typeof noInline === 'function') noInline(scorePostingDoc)

          const results = new Map()
          function drive(updateMode, count) {
            for (let i = 0; i < count; i++) {
              const docId = updateMode ? i % INSERTS : i
              sink ^= scorePostingDoc(results, docId, 1 + (i & 3)) | 0
            }
          }

          drive(false, INSERTS)
          const start = now()
          drive(true, UPDATES)
          const elapsedMs = now() - start
          if (results.size !== INSERTS)
            throw new Error(`unexpected result size: ${results.size}`)
          emit(`REPRO elapsed_ms=${elapsedMs.toFixed(3)} inserts=${INSERTS} updates=${UPDATES} sink=${sink}`)
          JS
          printf "'use strict';\n" > "$NO_CAPTURE_STRICT"
          cat "$NO_CAPTURE" >> "$NO_CAPTURE_STRICT"

          run_case() {
            label="$1"
            file="$2"
            mode="$3"
            allowlist="${4:-}"
            args=(
              --useFTLJIT=false
              --useConcurrentJIT=false
              --reportDFGCompileTimes=true
              --logCompilationChanges=true
              --printEachOSRExit=true
              --verboseDFGOSRExit=true
              --verboseOSR=true
              --verboseCallLink=true
            )
            if [ -n "$allowlist" ]; then
              args+=(--dfgAllowlist="$allowlist")
            fi
            if [ "$mode" = module ]; then
              "$JSC" "${args[@]}" --module-file="$file" >"${label}.all" 2>&1
            else
              "$JSC" "${args[@]}" "$file" >"${label}.all" 2>&1
            fi
            exits=$(grep -c 'Speculation failure in scorePostingDoc.*InadequateCoverage' "${label}.all" || true)
            max=$(grep 'Speculation failure in scorePostingDoc.*InadequateCoverage' "${label}.all" | sed -n 's/.*osrExitCounter = \([0-9]*\).*/\1/p' | sort -n | tail -1 || true)
            score_dfg=$(grep -c 'Optimized scorePostingDoc' "${label}.all" || true)
            drive_dfg=$(grep -c 'Optimized drive' "${label}.all" || true)
            repro=$(grep '^REPRO ' "${label}.all" | tail -1 || true)
            echo "LINKAGE ${label} mode=${mode} allowlist=${allowlist:-all} ${repro#REPRO } inadequate_exits=${exits} max_counter=${max:-0} score_dfg=${score_dfg} drive_dfg=${drive_dfg}"
            echo "--- ${label} call/reoptimization markers ---"
            grep -E 'scorePostingDoc|drive|CallLink|call link|OSR entry|reoptim|Jettison|Speculation failure' "${label}.all" | head -280 || true
          }

          run_case module-lexical "$SCRIPT" module
          run_case module-global-property "$GLOBAL_CALL" module
          run_case module-callee-only-dfg "$SCRIPT" module scorePostingDoc
          run_case strict-script "$STRICT_SCRIPT" script
          run_case module-no-callee-capture "$NO_CAPTURE" module
          run_case strict-script-no-callee-capture "$NO_CAPTURE_STRICT" script

      - name: Compare DFG caller graphs
        shell: bash
        run: |
          set -euo pipefail
          JSC="$PWD/bun-webkit/bin/jsc"
          SCRIPT="$PWD/benchmarks/jsc/inadequate-coverage-repro.js"
          STRICT_SCRIPT="$RUNNER_TEMP/inadequate-coverage-strict-script.js"
          printf "'use strict';\n" > "$STRICT_SCRIPT"
          cat "$SCRIPT" >> "$STRICT_SCRIPT"
          args=(
            --useFTLJIT=false
            --useConcurrentJIT=false
            --dumpGraphAfterParsing=true
            --logCompilationChanges=true
          )
          "$JSC" "${args[@]}" --module-file="$SCRIPT" >module-graph.all 2>&1
          "$JSC" "${args[@]}" "$STRICT_SCRIPT" >strict-script-graph.all 2>&1
          echo '--- module drive graph call nodes ---'
          grep -E 'DFG for drive#|FilterCallLinkStatus|DirectCall|Call\(' module-graph.all | head -220 || true
          echo '--- strict script drive graph call nodes ---'
          grep -E 'DFG for drive#|FilterCallLinkStatus|DirectCall|Call\(' strict-script-graph.all | head -220 || true

      - name: Upload linkage logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-jsc-module-linkage-cb61607
          path: '*.all'
