name: Engine benchmark smoke

on:
  pull_request:
    paths:
      - 'benchmarks/engines/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/engine-benchmark-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.7.0'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: pnpm install --frozen-lockfile
      - run: FMS_REQUIRE_RSS=1 node benchmarks/engines/run.mjs

      - name: Compact JSC OSR/reoptimization diagnostic
        shell: bash
        run: |
          run_case() {
            label="$1"
            threshold="$2"
            file="benchmarks/tmp/engines/issue4-multi-only.js"
            echo "=== ${label} ==="
            if [ -n "$threshold" ]; then
              BUN_JSC_useFTLJIT=false \
              BUN_JSC_useConcurrentJIT=false \
              BUN_JSC_reportDFGCompileTimes=true \
              BUN_JSC_logCompilationChanges=true \
              BUN_JSC_printEachOSRExit=true \
              BUN_JSC_verboseDFGOSRExit=true \
              BUN_JSC_osrExitCountForReoptimizationFromLoop="$threshold" \
              bun "$file" >"${label}.out" 2>"${label}.jit"
            else
              BUN_JSC_useFTLJIT=false \
              BUN_JSC_useConcurrentJIT=false \
              BUN_JSC_reportDFGCompileTimes=true \
              BUN_JSC_logCompilationChanges=true \
              BUN_JSC_printEachOSRExit=true \
              BUN_JSC_verboseDFGOSRExit=true \
              bun "$file" >"${label}.out" 2>"${label}.jit"
            fi

            grep '@@FROZEN_ENGINE_BENCH@@' "${label}.out" || true
            printf 'scorePostingDoc DFG optimizations: '
            grep -c 'Optimized scorePostingDoc' "${label}.jit" || true
            printf 'aggregateSegmentPostingList DFG optimizations: '
            grep -c 'Optimized aggregateSegmentPostingList' "${label}.jit" || true
            echo '-- scorePostingDoc compilation sequence --'
            grep -E 'compiling scorePostingDoc|Optimized scorePostingDoc' "${label}.jit" || true
            echo '-- reoptimization/OSR-exit summary --'
            grep -Ei 'We exited .*Reoptimizing|scorePostingDoc.*(exit|OSR)|exit.*scorePostingDoc' "${label}.jit" || true
          }

          run_case default ''
          run_case reopt100 100
          run_case reopt1000 1000
