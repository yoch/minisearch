name: Engine benchmark smoke

on:
  pull_request:
    paths:
      - 'benchmarks/engines/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/engine-benchmark-smoke.yml'
      - '.github/scripts/issue4-hoist-scoring.py'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.7.0'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: pnpm install --frozen-lockfile

      - name: Apply and validate scoring-invariant hoist
        shell: bash
        run: |
          python .github/scripts/issue4-hoist-scoring.py
          git diff --check
          git diff -- src/scoring.ts
          pnpm typecheck
          pnpm test

      - name: Engine benchmark
        run: FMS_REQUIRE_RSS=1 node benchmarks/engines/run.mjs

      - name: Targeted JSC traces
        shell: bash
        run: |
          trace_jsc() {
            label="$1"
            file="$2"
            echo "=== JSC ${label} ==="
            BUN_JSC_useFTLJIT=false \
            BUN_JSC_useConcurrentJIT=false \
            BUN_JSC_reportDFGCompileTimes=true \
            BUN_JSC_logCompilationChanges=true \
            bun "$file" >"${label}.out" 2>"${label}.jit"
            cat "${label}.out"
            echo "--- scorePostingDoc compile count ---"
            grep -c 'Optimized scorePostingDoc' "${label}.jit" || true
            echo "--- targeted hot paths ---"
            grep -E 'compiling (scorePostingDoc|aggregateSegmentPostingList)|Optimized (scorePostingDoc|aggregateSegmentPostingList)' "${label}.jit" || true
          }

          trace_jsc resident-history benchmarks/tmp/engines/resident-pressure.js
          trace_jsc multi-only benchmarks/tmp/engines/issue4-multi-only.js
