name: Engine benchmark smoke

on:
  pull_request:
    paths:
      - 'benchmarks/engines/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/engine-benchmark-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.7.0'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: pnpm install --frozen-lockfile
      - run: FMS_REQUIRE_RSS=1 node benchmarks/engines/run.mjs
      - name: Issue 4 JSC tier controls
        shell: bash
        run: |
          echo '=== resident-pressure: Bun with FTL disabled ==='
          BUN_JSC_useFTLJIT=false /usr/bin/time -v bun benchmarks/tmp/engines/resident-pressure.js
          echo '=== resident-pressure: Bun with DFG disabled ==='
          BUN_JSC_useDFGJIT=false /usr/bin/time -v bun benchmarks/tmp/engines/resident-pressure.js
          echo '=== resident-pressure: Bun with all JIT disabled ==='
          BUN_JSC_useJIT=false /usr/bin/time -v bun benchmarks/tmp/engines/resident-pressure.js
