name: Engine benchmark smoke

on:
  pull_request:
    paths:
      - 'benchmarks/engines/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/engine-benchmark-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.7.0'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: pnpm install --frozen-lockfile
      - run: FMS_REQUIRE_RSS=1 node benchmarks/engines/run.mjs
      - name: Issue 4 JSC DFG compilation trace
        shell: bash
        run: |
          trace_bundle() {
            label="$1"
            file="$2"
            echo "=== ${label} ==="
            BUN_JSC_useFTLJIT=false \
            BUN_JSC_useConcurrentJIT=false \
            BUN_JSC_reportDFGCompileTimes=true \
            BUN_JSC_logCompilationChanges=true \
            bun "$file" >"${label}.out" 2>"${label}.jit" || {
              cat "${label}.jit"
              exit 1
            }
            cat "${label}.out"
            echo "--- DFG/compilation lines (${label}) ---"
            grep -Ei 'executeQuery|aggregate|scorePosting|runSearch|DFG|compil|tier|OSR|search' "${label}.jit" | head -n 400 || true
            echo "--- total JIT diagnostic lines (${label}) ---"
            wc -l "${label}.jit"
          }

          trace_bundle resident-history benchmarks/tmp/engines/resident-pressure.js
          trace_bundle multi-only benchmarks/tmp/engines/issue4-multi-only.js
